<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixamo Room</title>
<style>
  body{margin:0;background:#222;color:#fff;font-family:sans-serif;overflow:hidden}
  #ui{position:fixed;bottom:0;left:0;right:0;background:#000d;padding:8px;max-height:44vh;overflow:auto}
  #msg{position:fixed;top:8px;left:8px;right:8px;font-size:13px;text-shadow:0 0 4px #000}
  button{margin:2px;padding:8px 12px;border:0;border-radius:6px;background:#2a7;color:#fff}
  button.alt{background:#46c}
  button.stop{background:#c43}
  textarea{width:100%;box-sizing:border-box;padding:8px;font-size:14px}
  label{display:block;font-size:13px;margin-top:4px}
  input[type=range]{width:100%}
  details{margin-top:6px}
</style>
</head>
<body>
<div id="msg">Loading...</div>
<div id="ui">
  <textarea id="script" rows="3">spawn outside, wave 2, enter, goto center, talk 3, sit chair, wait 3, goto sofa</textarea>
  <button id="play" class="alt">Play script</button>
  <button id="stop" class="stop">Stop</button>
  <div id="cmds"></div>
  <details>
    <summary>Change the body</summary>
    <label>Height <input type="range" id="h" min="0.7" max="1.4" step="0.01" value="1"></label>
    <label>Fatness <input type="range" id="f" min="0.7" max="1.8" step="0.01" value="1"></label>
    <label>Head size <input type="range" id="hd" min="0.7" max="2" step="0.01" value="1"></label>
    <label>Arm length <input type="range" id="a" min="0.7" max="1.6" step="0.01" value="1"></label>
    <label>Color tint <input type="color" id="c" value="#ffffff"></label>
    <button id="rnd">Random new character</button>
  </details>
</div>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const ANIMS = ['idle','walk','run','sit','wave','talk'];

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, -0.5);
controls.maxPolarAngle = Math.PI/2 - 0.02;

function fitCamera(){
  const vf = THREE.MathUtils.degToRad(camera.fov);
  const hf = 2*Math.atan(Math.tan(vf/2)*camera.aspect);
  const d = Math.min(Math.max(3.4/Math.tan(hf/2), 7), 16);
  camera.position.set(0, 1.5 + d*0.22, d);
  controls.update();
}
fitCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0x887766, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(3, 6, 5);
scene.add(sun);

// ---------- Room helpers ----------
function box(w,h,d,color,x,y,z,parent=scene){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color})
  );
  m.position.set(x,y,z);
  parent.add(m);
  return m;
}

// Floors
box(6.4,0.1,6,0x9c6b3f,0,-0.05,0);          // room floor
box(2.6,0.1,3,0x888888,-1.6,-0.05,-4.6);    // porch outside door
box(2.4,0.02,1.6,0x8b2e2e,0,0.01,0.6);      // rug

// Walls (back wall has a door gap at x -2.1 to -1.1)
const wallColor = 0xf2e6d0;
box(0.9,3,0.2,wallColor,-2.55,1.5,-3);
box(4.1,3,0.2,wallColor,0.95,1.5,-3);
box(1.0,0.9,0.2,wallColor,-1.6,2.55,-3);    // above the door
box(0.2,3,6,wallColor,-3,1.5,0);            // left wall
box(0.2,3,6,wallColor,3,1.5,0);             // right wall

// Door (hinged, opens into the room)
const doorPivot = new THREE.Group();
doorPivot.position.set(-1.1,0,-3);
scene.add(doorPivot);
box(1,2.1,0.06,0x7a4a21,-0.5,1.05,0,doorPivot);
box(0.08,0.08,0.08,0xd4af37,-0.9,1.0,0.06,doorPivot);
let doorAngle = 0, doorTarget = 0;

// Window on left wall
box(0.05,1.1,1.5,0xffffff,-2.9,1.6,-0.5);
box(0.05,0.95,1.35,0xbfe8ff,-2.87,1.6,-0.5);

// Picture on back wall
box(1.0,0.7,0.03,0x442200,0.2,1.8,-2.89);
box(0.9,0.6,0.03,0x3a78c2,0.2,1.8,-2.87);

// Chair (faces the camera)
const chair = new THREE.Group();
chair.position.set(-0.3,0,-0.6);
scene.add(chair);
box(0.5,0.06,0.5,0x8a5a2b,0,0.45,0,chair);
box(0.5,0.5,0.05,0x8a5a2b,0,0.75,-0.22,chair);
[[-0.22,-0.22],[0.22,-0.22],[-0.22,0.22],[0.22,0.22]].forEach(([x,z]) =>
  box(0.05,0.45,0.05,0x5a3a1b,x,0.225,z,chair));

// Sofa (faces the camera)
const sofa = new THREE.Group();
sofa.position.set(1.6,0,-2.5);
scene.add(sofa);
box(1.8,0.3,0.8,0x3b5b92,0,0.15,0,sofa);
box(1.8,0.5,0.2,0x3b5b92,0,0.55,-0.3,sofa);
box(0.2,0.5,0.8,0x2f4a78,-0.9,0.35,0,sofa);
box(0.2,0.5,0.8,0x2f4a78,0.9,0.35,0,sofa);
box(1.4,0.15,0.6,0x4a6ca8,0,0.38,0.08,sofa);

// Side table + lamp
const tbl = new THREE.Mesh(
  new THREE.CylinderGeometry(0.3,0.3,0.06,24),
  new THREE.MeshStandardMaterial({color:0x6b4423}));
tbl.position.set(0.7,0.6,-0.7); scene.add(tbl);
const tleg = new THREE.Mesh(
  new THREE.CylinderGeometry(0.04,0.04,0.6,12),
  new THREE.MeshStandardMaterial({color:0x4a2f16}));
tleg.position.set(0.7,0.3,-0.7); scene.add(tleg);
const shade = new THREE.Mesh(
  new THREE.ConeGeometry(0.16,0.22,20),
  new THREE.MeshStandardMaterial({color:0xffe9a0, emissive:0xffcc55, emissiveIntensity:0.7}));
shade.position.set(0.7,0.8,-0.7); scene.add(shade);

// ---------- Places the character can go ----------
const PLACES = {
  center : {x:0,    z:1.5},
  door   : {x:-1.6, z:-3.0},
  inside : {x:-1.6, z:-1.8},
  outside: {x:-1.6, z:-4.6},
  chair  : {x:-0.3, z:0.6,  seat:{x:-0.3, z:-0.55}},
  sofa   : {x:1.6,  z:-1.2, seat:{x:1.6,  z:-2.45}},
};

// ---------- Actor ----------
const actor = new THREE.Group();
actor.position.set(0,0,1.5);
scene.add(actor);
let model, mixer, current, head, armL, armR;
const actions = {};
const loader = new FBXLoader();
const load = (url, progress) => new Promise((ok, bad) => loader.load(url, ok, progress, bad));

async function start(){
  try{
    model = await load('models/character.fbx', e => {
      if (e.total) $('msg').textContent = 'Loading character ' + Math.round(e.loaded/e.total*100) + '%';
    });
    model.scale.setScalar(0.01);
    actor.add(model);
    mixer = new THREE.AnimationMixer(model);
    const missing = [];
    for (const n of ANIMS){
      try{
        const f = await load(`models/${n}.fbx`);
        const clip = f.animations[0];
        clip.name = n;
        actions[n] = mixer.clipAction(clip);
      }catch(e){ missing.push(n); }
    }
    head = model.getObjectByName('mixamorigHead');
    armL = model.getObjectByName('mixamorigLeftArm');
    armR = model.getObjectByName('mixamorigRightArm');

    Object.keys(actions).forEach(n => addBtn(n, n, ''));
    ['goto center','sit chair','sit sofa','open','close','enter','leave']
      .forEach(c => addBtn(c, c, 'alt'));

    $('msg').textContent = 'Ready' + (missing.length ? ' (missing: ' + missing.join(', ') + ')' : '');
    play('idle');
  }catch(e){
    console.error(e);
    $('msg').textContent = 'Error: ' + (e && e.message ? e.message : 'could not read character file');
  }
}

function addBtn(label, command, cls){
  const b = document.createElement('button');
  b.textContent = label;
  if (cls) b.className = cls;
  b.onclick = () => runScript(command);
  $('cmds').appendChild(b);
}

function play(name){
  const next = actions[name];
  if (!next) return false;
  if (current === next) return true;
  if (current) current.fadeOut(0.3);
  next.reset().fadeIn(0.3).play();
  current = next;
  return true;
}

// ---------- Movement ----------
let mover = null;
function moveTo(x, z, speed, face){
  return new Promise(res => {
    const dx = x - actor.position.x, dz = z - actor.position.z;
    if (face === undefined){
      if (Math.hypot(dx,dz) > 0.01) actor.rotation.y = Math.atan2(dx,dz);
    } else actor.rotation.y = face;
    mover = {x, z, speed, res};
  });
}
const wait = s => new Promise(r => setTimeout(r, s*1000));

// ---------- Commands ----------
let token = 0;

async function exec(cmd){
  const [c, a] = cmd.trim().toLowerCase().split(/\s+/);
  if (!c) return;

  if (c === 'goto' || c === 'runto'){
    const t = PLACES[a];
    if (!t) throw new Error('Unknown place: ' + a);
    play(c === 'goto' ? 'walk' : 'run');
    await moveTo(t.x, t.z, c === 'goto' ? 1.3 : 3.2);
    play('idle');
  }
  else if (c === 'sit' && PLACES[a] && PLACES[a].seat){
    const t = PLACES[a];
    play('walk');
    await moveTo(t.x, t.z, 1.3);
    play('sit');
    await moveTo(t.seat.x, t.seat.z, 0.8, 0);   // turn around and sit back
  }
  else if (c === 'spawn'){
    const t = PLACES[a];
    if (!t) throw new Error('Unknown place: ' + a);
    actor.position.set(t.x, 0, t.z);
    actor.rotation.y = 0;
    play('idle');
  }
  else if (c === 'open'){ doorTarget = 1.7; await wait(1); }
  else if (c === 'close'){ doorTarget = 0; await wait(1); }
  else if (c === 'enter'){
    await exec('open'); await exec('goto door');
    await exec('goto inside'); await exec('close');
  }
  else if (c === 'leave'){
    await exec('open'); await exec('goto door');
    await exec('goto outside'); await exec('close');
  }
  else if (c === 'wait'){ await wait(+a || 1); }
  else if (actions[c]){ play(c); await wait(+a || 3); }
  else throw new Error('Unknown command: ' + c);
}

async function runScript(text){
  const my = ++token;
  const list = text.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
  try{
    for (const cmd of list){
      if (my !== token) return;
      $('msg').textContent = '> ' + cmd;
      await exec(cmd);
    }
    if (my === token) $('msg').textContent = 'Done';
  }catch(e){
    $('msg').textContent = e.message;
  }
}

$('play').onclick = () => runScript($('script').value);
$('stop').onclick = () => {
  token++;
  if (mover){ const r = mover.res; mover = null; r(); }
  play('idle');
  $('msg').textContent = 'Stopped';
};

// ---------- Body changes ----------
function applyBody(){
  const f = +$('f').value, h = +$('h').value;
  actor.scale.set(f, h, f);
  if (head) head.scale.setScalar(+$('hd').value);
  [armL, armR].forEach(b => b && b.scale.setScalar(+$('a').value));
}
function tint(){
  if (!model) return;
  model.traverse(o => {
    if (o.isMesh){
      (Array.isArray(o.material) ? o.material : [o.material])
        .forEach(m => m.color && m.color.set($('c').value));
    }
  });
}
$('c').oninput = tint;
$('rnd').onclick = () => {
  const r = (a, b) => (a + Math.random()*(b-a)).toFixed(2);
  $('h').value = r(0.8, 1.3);
  $('f').value = r(0.8, 1.6);
  $('hd').value = r(0.8, 1.8);
  $('a').value = r(0.8, 1.4);
  $('c').value = '#' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');
  tint();
};

// ---------- Loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (mixer) mixer.update(dt);

  if (mover){
    const dx = mover.x - actor.position.x, dz = mover.z - actor.position.z;
    const dist = Math.hypot(dx, dz), step = mover.speed * dt;
    if (dist <= step){
      actor.position.x = mover.x; actor.position.z = mover.z;
      const r = mover.res; mover = null; r();
    } else {
      actor.position.x += dx/dist*step;
      actor.position.z += dz/dist*step;
    }
  }

  doorAngle += (doorTarget - doorAngle) * Math.min(1, dt*4);
  doorPivot.rotation.y = doorAngle;

  applyBody();
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  fitCamera();
});

start();
</script>
</body>
</html>
