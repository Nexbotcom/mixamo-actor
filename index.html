<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Realistic Studio</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; font-family: system-ui, sans-serif; color: #e8eaf0; }
  #stage { position: fixed; top: 0; left: 0; width: 100vw; display: grid; place-items: center; }
  #stage canvas { display: block; touch-action: none; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: #151922; border-top: 1px solid #262c3a; }
  .row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  select, button { font-size: 13px; padding: 7px 9px; border-radius: 8px; border: 1px solid #343c50; background: #1e2433; color: #e8eaf0; }
  button:active { background: #2c3550; }
  #msg { font-size: 12px; color: #9fb0cf; min-height: 15px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <div class="row"><select id="pick"></select><button id="add">Add character</button><select id="active"></select></div>
  <div class="row"><select id="anim"></select><button id="play">Play</button></div>
  <div class="row"><button id="gait">Walk</button><button id="follow">Follow: on</button><button id="aspect">16:9</button><button id="quality">Quality: low</button></div>
  <div id="msg">Tap the ground to walk there. One finger orbits, pinch zooms, two fingers pan.</div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
